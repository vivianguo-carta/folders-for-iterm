[project]
name = "tabsidebar"
version = "0.1.0"
description = "Group iTerm2 tabs into folders in a sidebar in iTerm2's Toolbelt."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["iterm2", "terminal", "tabs", "macos"]
classifiers = [
    "Environment :: MacOS X",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Terminals",
]
dependencies = [
    "aiohttp>=3.14.5",
    "iterm2>=2.30",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
tabsidebar = "tabsidebar.daemon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["tests"]
